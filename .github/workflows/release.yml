name: Авто-релиз
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить и собрать расширение
        run: npm test

      - name: Упаковать расширение
        run: cd dist && zip -r ../extension.zip .

      - name: Создать релиз
        uses: softprops/action-gh-release@v2
        with:
          files: extension.zip
